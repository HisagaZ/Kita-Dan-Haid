<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Kita dan Haid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="campaign_landing.css">
    <style>
        body {
            background-color: #f0f0f0;
            padding-top: 40px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 40px;
            border: 4px solid #000;
            box-shadow: 20px 20px 0px rgba(0, 0, 0, 0.1);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .admin-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
        }

        .card-editor {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .edit-card {
            background: #fafafa;
            border: 2px solid #eee;
            padding: 30px;
            border-radius: 20px;
            position: relative;
        }

        .edit-card h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: var(--primary-blue);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
        }

        .btn-save {
            background: var(--text-dark);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-premium);
        }

        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-add {
            background: var(--primary-blue);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .code-output {
            background: #222;
            color: #4ade80;
            padding: 30px;
            border-radius: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 30px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .admin-nav {
            margin-bottom: 30px;
        }

        .admin-nav button {
            background: none;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            margin-right: 30px;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.3s;
        }

        .admin-nav button.active {
            opacity: 1;
            color: var(--primary-maroon);
            border-bottom: 3px solid var(--primary-maroon);
        }

        .btn-add-new {
            background: var(--primary-blue);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-premium);
            box-shadow: 0 4px 15px rgba(27, 108, 177, 0.3);
        }

        .btn-add-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(27, 108, 177, 0.4);
        }
    </style>
</head>

<body>

    <header id="header-placeholder"></header>

    <div class="admin-container" style="margin-top: 40px; margin-bottom: 40px;">
        <div class="admin-header">
            <h1>Admin Dashboard</h1>
            <a href="campaign_landing.html" style="text-decoration: none; color: #777;">Exit Dashboard ↗</a>
        </div>

        <div class="admin-nav">
            <button class="active" onclick="switchTab('blue')">Goal Cards (Blue)</button>
            <button onclick="switchTab('white')">Goal Cards (White)</button>
        </div>

        <div id="blueCards" class="card-editor">
            <!-- Cards will be populated here -->
        </div>

        <div id="whiteCards" class="card-editor" style="display: none;">
            <!-- Cards will be populated here -->
        </div>

        <div style="text-align: center; margin-top: 40px; border-top: 2px solid #eee; padding-top: 40px;">
            <p style="margin-bottom: 20px; color: #666;">Note: Since this is a static site, changes are not saved to a database. Click the button below to generate the code you need to copy into your HTML file.</p>
            <button class="btn-save" onclick="generateCode()">Generate Updated HTML Code</button>
        </div>

        <div id="outputArea" class="code-output">
            <h4 style="color: white; margin-bottom: 10px;">Copy this block and replace the corresponding section in your HTML file:</h4>
            <pre id="codeSnippet"></pre>
        </div>
    </div>

    <footer id="footer-placeholder" class="main-footer"></footer>

    <script src="campaign_landing.js"></script>
    <script>
        const blueCardsData = [
            { title: "Goal 1", text: "Ensuring every girl has access to sanitary products and clean water facilities in their schools and homes.", img: "DSC05105.JPG" },
            { title: "Goal 2", text: "Providing comprehensive menstrual hygiene education to break taboos and empower young women.", img: "DSC05106.JPG" },
            { title: "Goal 3", text: "Building sustainable sanitation infrastructure to support menstrual dignity in rural communities.", img: "DSC05107.JPG" }
        ];
 
        const whiteCardsData = [
            { title: "Goal 4", text: "Engaging local leaders and communities to foster an environment where menstruation is never a barrier.", img: "DSC05113.JPG" },
            { title: "Goal 5", text: "Advocating for policy changes that eliminate taxes on period products and ensure equal health rights.", img: "DSC05114.JPG" },
            { title: "Goal 6", text: "Supporting innovative, sustainable, and eco-friendly menstrual solutions for long-term impact.", img: "DSC05115.JPG" }
        ];

        function renderCards() {
            const blueContainer = document.getElementById('blueCards');
            blueContainer.innerHTML = blueCardsData.map((card, index) => `
                <div class="edit-card">
                    <h3>Blue Card #${index + 1}</h3>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" value="${card.title}" onchange="updateCard('blue', ${index}, 'title', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea rows="3" onchange="updateCard('blue', ${index}, 'text', this.value)">${card.text}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Image Filename</label>
                        <input type="text" value="${card.img}" onchange="updateCard('blue', ${index}, 'img', this.value)">
                    </div>
                </div>
            `).join('');

            const whiteContainer = document.getElementById('whiteCards');
            whiteContainer.innerHTML = whiteCardsData.map((card, index) => `
                <div class="edit-card">
                    <h3>White Card #${index + 1}</h3>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" value="${card.title}" onchange="updateCard('white', ${index}, 'title', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea rows="3" onchange="updateCard('white', ${index}, 'text', this.value)">${card.text}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Image Filename</label>
                        <input type="text" value="${card.img}" onchange="updateCard('white', ${index}, 'img', this.value)">
                    </div>
                </div>
            `).join('');
        }

        function updateCard(type, index, field, value) {
            if (type === 'blue') blueCardsData[index][field] = value;
            else whiteCardsData[index][field] = value;
        }

        function switchTab(tab) {
            document.getElementById('blueCards').style.display = tab === 'blue' ? 'grid' : 'none';
            document.getElementById('whiteCards').style.display = tab === 'white' ? 'grid' : 'none';
            document.querySelectorAll('.admin-nav button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function generateCode() {
            let html = "";
            const currentTab = document.querySelector('.admin-nav button.active').innerText.includes('Blue') ? 'blue' : 'white';
            
            if (currentTab === 'blue') {
                html = blueCardsData.map((card, i) => `
            <div class="goal-card-blue scroll-reveal" style="transition-delay: 0.${i + 1}s">
                <div class="circle-icon">
                    <img src="${card.img}" alt="Icon">
                </div>
                <h3>${card.title}</h3>
                <p>${card.text}</p>
            </div>`).join('');
            } else {
                html = whiteCardsData.map((card, i) => `
            <div class="goal-card-white scroll-reveal" style="transition-delay: 0.${i + 1}s">
                <div class="circle-icon-blue">
                    <img src="${card.img}" alt="Icon">
                </div>
                <h3>${card.title}</h3>
                <p>${card.text}</p>
            </div>`).join('');
            }

            document.getElementById('outputArea').style.display = 'block';
            document.getElementById('codeSnippet').innerText = html;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        renderCards();
    </script>
</body>

</html>
