<svg xmlns="http://w3.org" viewBox="0 0 560 280" width="100%" height="100%">
  <defs>
    <clipPath id="canton-clip">
      <rect x="0" y="0" width="224" height="140"/>
    </clipPath>
    
    <g id="star-14">
      <polygon points="0,-12 3.5,-3.5 12,-3.5 5.5,1.5 8,10 0,5 -8,10 -5.5,1.5 -12,-3.5 -3.5,-3.5" fill="#FFCC00"/>
    </g>
  </defs>

  <!-- Base: 14 Alternating Red and White Stripes -->
  <rect width="560" height="280" fill="#CC0001"/>
  <rect width="560" height="260" fill="#FFFFFF"/>
  <rect width="560" height="240" fill="#CC0001"/>
  <rect width="560" height="220" fill="#FFFFFF"/>
  <rect width="560" height="200" fill="#CC0001"/>
  <rect width="560" height="180" fill="#FFFFFF"/>
  <rect width="560" height="160" fill="#CC0001"/>

  <!-- Blue Canton (Union) -->
  <rect x="0" y="0" width="224" height="140" fill="#010066"/>

  <!-- Crescent and 14-Point Star -->
  <g clip-path="url(#canton-clip)">
    <!-- Crescent Moon -->
    <path d="M 80,18 A 52,52 0 1,0 80,122 A 44,44 0 1,1 80,18 Z" fill="#FFCC00"/>

    <!-- 14-Point Star -->
    <g transform="translate(136, 70) scale(4)">
      <use href="#star-14"/>
    </g>
  </g>

  <!-- Bottom 7 Stripes -->
  <rect width="560" height="140" fill="#FFFFFF"/>
  <rect width="560" height="120" fill="#CC0001"/>
  <rect width="560" height="100" fill="#FFFFFF"/>
  <rect width="560" height="80" fill="#CC0001"/>
  <rect width="560" height="60" fill="#FFFFFF"/>
  <rect width="560" height="40" fill="#CC0001"/>
  <rect width="560" height="20" fill="#FFFFFF"/>
</svg>